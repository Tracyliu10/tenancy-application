const stageLeads = [
  'Enter the property and lease details agreed with your sales consultant.',

const groupLabel = heading => t(...heading.split(' · '));
const signTitle = key => key === 'declaration'
  ? t('签字 1 · 申请声明','Signature 1 · Declaration')

const choices = {

  'No — I will arrange my own utilities':'否，我会自行开通公用服务',

};
const optionLabel = value => value ? t(choices[value] || value,value) : t('请选择','Select an option');
const writingGuide = () => t(
  '请使用英文填写。姓名请按证件上的拉丁字母拼写，例如姓 Zhang、名 San。地址示例：12 George Street, Sydney NSW。证件号码、邮箱和电话请按原样填写。',
  'Use English for written answers. Enter names as shown on your ID, for example Surname: Zhang, Given name: San. Address example: 12 George Street, Sydney NSW. Keep ID numbers, email addresses and phone numbers as issued.'
);
function bindText(node, getText) {
  const update = () => { node.textContent = getText(); };
  localized.push(update);
  update();
  return node;
}
function translated(tag, getText, className) {
  return bindText(element(tag,'',className),getText);
}

const terms = {
  "declaration": "I hereby offer to rent the property from the owner under a lease to be prepared by Inndeavor. Should this application be accepted by the landlord I agree to enter into a Residential Tenancies Agreement pursuant to the Residential Tenancies Act 2010.\nI acknowledge that this application is subject to the approval of the owner/landlord. I declare that all information contained in this application (including the reverse side) is true and correct and given of my own free will. I declare that I have inspected the premises and am not bankrupt.\nI authorise Inndeavor to obtain personal information from\n(a) the owner or the Agent of my current or previous residence;\n(b) my personal referees and employer/s;\n(c) any record, listing or database of defaults by tenants;\nIf I default under a rental agreement, Inndeavor may disclose details of any such default to a tenancy default database, and to agents/landlords of properties I may apply for in the future.\nI am aware that Inndeavor will use and disclose my personal information in order to:\n(a) communicate with the owner and select a tenant\n(b) prepare lease/tenancy documents\n(c) allow organizations/tradespeople to contact me\n(d) lodge/claim/transfer to/from the Residential Tenancies Bond Authority\n(e) refer to Tribunals/Courts & Statutory Authorities (where applicable)\n(f) refer to collection agents/lawyers (where applicable)\n(g) complete a credit check with NTD (National Tenancies Database)\nI am aware that if information is not provided or I do not consent to the uses to which personal information is put, the Inndeavor cannot provide me with the lease/tenancy of the premises.\nI consent to the disclosure of this page of the application form for the purpose of enabling Inndeavor to offer the connection services to me.\nWhere Inndeavor is requested to arrange for the provision of the services, I consent to Inndeavor disclosing personal information it has collected about me to utility service providers for that purpose and to obtain confirmation of the connection. I acknowledge that neither Inndeavor nor the Agent accept any responsibility for: any delay in, or failure to arrange or provide for, any connection of a utility, or for any loss in connection with such delay or failure. I acknowledge that the Accommodation provider, its employees and Inndeavor may receive a benefit in relation to the connection of a utility service.",
  "utilities": "If yes, please carry out the following process:\n1. Please provide your room address, move-in date, passport information, phone number and email address.\n2. We will assist you to connect the required utilities after receiving your application materials. After that, the energy company will call you to confirm the address and personal information. If utilities are not connected in time due to your own reasons (such as the telephone can not be connected, etc.), you shall take all responsible for it.\nPlease be noticed:\n(1) we only assist you to open the utilities account. All problems and disputes between you and the energy company, including abnormal bills and consumption problems, need you to contact the energy company directly. The Final Interpretation Right belongs to the energy company.\n(2) Please contact the energy company to shut down the utilities in time when checking out.",
  "holding": "The holding fee (not exceeding 1 week’s rent) keeps the premises off the market for the prospective tenant for 7 days.\nIn consideration of the above holding fee paid by the prospective tenant, the Inndeavor accommodation provider acknowledges that:\ni. The application for tenancy has been approved by the landlord; and\nii. During this period, the premises will not be reserved for any other applicant, nor will a holding fee be received from any other applicant, pending the making of a residential tenancy agreement; and\niii. If the prospective tenant(s) decide not to enter into such an agreement, the landlord may retain the whole fee; and\niv. If a residential tenancy agreement is entered into, the holding fee is to be paid towards rent for the residential premises concerned.\nv. The whole of the fee will be refunded to the prospective tenant if:\na) The entering into of the residential tenancy agreement is conditional on the landlord carrying out repairs or other work and the landlord does not carry out the repairs or other work during the specified period\nb) The landlord/Inndeavor have failed to disclose a material fact(s) or made misrepresentation(s) before entering into the residential tenancy agreement.\n",
  "id": "A minimum of 100 points is required for each applicant.\n-Points must be made up from each section A, B and C as shown\nA) Proof of Identity (30 Points)\nYou must provide one of the following:\n- Passport + Visa\n- COE (if have) / Driver’s licence (if have)\n- Birth Certificate + Photo ID\nB) Proof of Income (30 Points)\nYou must provide one of the following:\n- Last Pay Advice\n- Current Centerlink Statement\n- Current Bank Statement (must show\nsufficient funds to meet rental payments)\nC) Supporting Documentation (40 Points)\nYou must provide at least 40 points of the\nfollowing documentation:\n- Current Rental Ledger (from Agent) – 40 points\n- Last 2 Rent Receipts – 20 points\n- Two Written References – 20 points\n- Recent Rates Notice – 30 points\n- Vehicle Registration Papers – 10 points\n- Current Electricity/Phone Account – 10 points\n(Minimum of 40 points required)\nPlease Note: The points system has been designed to suit the majority of our applicants. If you are\nrenting for the first time or have difficulty achieving 100 points, please call us to discuss."

    ctx.textAlign = 'right';
    text(String(pages.length+1),width-margin,height-48,19,'#3c5b4e');
    ctx.textAlign = 'left';
    y = 166;
    pages.push(canvas);
  }

  function ensure(space) {
    if (y + space > height - 116) startPage();
  }

  function paragraph(content, size = 23, bold = false, color = '#102822') {
    const advance = Math.ceil(size * 1.42);
    for (const line of content.split('\n')) {
      let current = '';
      for (const part of line.match(/\s+|[^\s]+/gu) || []) {
        ctx.font = `${bold ? 700 : 400} ${size}px system-ui, sans-serif`;
        if (ctx.measureText(current+part).width > width-2*margin && current.trim()) {
          ensure(advance);
          text(current.trimEnd(),margin,y,size,color,bold);
          y += advance;
          current = '';
        }
        for (const character of part) {
          ctx.font = `${bold ? 700 : 400} ${size}px system-ui, sans-serif`;
          if (ctx.measureText(current+character).width > width-2*margin) {
            ensure(advance);
            text(current,margin,y,size,color,bold);
            y += advance;
            current = '';
          }
          if (current || character.trim()) current += character;
        }
      }
      ensure(advance);
      text(current.trimEnd(),margin,y,size,color,bold);
      y += advance;
    }
  }

  function heading(label) {
    y += 15;
    ensure(120);
    ctx.fillStyle = '#e9f2e4';
    ctx.fillRect(margin,y-28,width-2*margin,45);
    text(label,margin+14,y+2,25,'#174939',true);
    y += 57;
  }

  function drawSignature(key, label) {
    y += 18;
    ensure(218);
    paragraph(label+t('  |  签署日期：','  |  Date signed: ')+value(key+'Date'),23,true);
    ctx.fillStyle = '#f4f7f2';
    ctx.fillRect(margin,y-10,500,150);
    ctx.drawImage(signatures.get(key).canvas,margin,y-10,500,150);
    y += 165;
  }

  startPage();
  paragraph(t('签字版租房申请','Signed tenancy application'),43,true);
  paragraph(t(value('surname')+' '+value('given'),value('given')+' '+value('surname'))+'  |  '+value('property'),26);
  heading(t('A. 房屋提供方','A. Accommodation provider'));
  paragraph('INNDEAVOR · Suite A, Level 13, UTS Central Building (CB02) 61 Broadway, Ultimo NSW 2007');
  paragraph('(02) 9739 8988 · rentalteam@inndeavor.com');
  const groups = stages.flatMap(stage=>stage.groups);
  for (const letter of ['B','C','D','E','F','G','H','I']) {
    const list = groups.filter(([heading])=>heading.startsWith(letter+'.'));
    if (letter === 'C') list.push(groups.find(([heading])=>heading.startsWith('联系方式')));
    for (const [name,fields] of list) {
      heading(groupLabel(name));
      for (const [key,label,english] of fields) paragraph(t(label+'：',english+': ')+reportValue(key));
      if (letter === 'D' && value('utility').startsWith('Yes')) {
        y += 10;
        paragraph(displayTerms('utilities'),20);
      }
      if (letter === 'E') {
        y += 10;
        paragraph(displayTerms('declaration'),20);
        drawSignature('declaration',signTitle('declaration'));
      }
      if (letter === 'I') {
        y += 10;
        paragraph(displayTerms('holding'),20);
        drawSignature('holding',signTitle('holding'));
      }
    }
  }
  heading(t('J. 100 分身份证明材料','J. 100 points of ID required'));
  paragraph(displayTerms('id'),20);
  heading(t('房屋提供方专用','Accommodation provider use only'));
  paragraph(t('签字：_____________________    日期：__________________','Signature: _______________________    Date: __________________'));
  paragraph(t('租赁经理：________________    口译语言：________________','Leasing manager: ________________    Interpreter language: ________________'));
  return encodePdf(pages);
}

// A standard PDF with one JPEG XObject per A4 page, requiring no network libraries.
function encodePdf(pages) {
  const encoder = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let length = 0;
  function append(data) {
    const bytes = typeof data === 'string' ? encoder.encode(data) : data;
    chunks.push(bytes);
    length += bytes.length;
  }
  function object(id, body, bytes) {
    offsets[id] = length;
    append(id+' 0 obj\n'+body);
    if (bytes) {
      append('\nstream\n');
      append(bytes);
      append('\nendstream');
    }
    append('\nendobj\n');
  }
  append('%PDF-1.4\n');
  append(new Uint8Array([37,226,227,207,211,10]));
  object(1,'<< /Type /Catalog /Pages 2 0 R >>');
  object(2,`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>3+i*3+' 0 R').join(' ')}] >>`);
  for (const [index,page] of pages.entries()) {
    const id = 3+index*3;
    const jpeg = Uint8Array.from(atob(page.toDataURL('image/jpeg',0.92).split(',')[1]),c=>c.charCodeAt(0));
    const stream = encoder.encode('q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n');
    object(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${id+1} 0 R >> >> /Contents ${id+2} 0 R >>`);
    object(id+1,`<< /Type /XObject /Subtype /Image /Width ${page.width} /Height ${page.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>`,jpeg);
    object(id+2,`<< /Length ${stream.length} >>`,stream);
  }
  const xref = length;
  append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);
  for (const offset of offsets.slice(1)) append(String(offset).padStart(10,'0')+' 00000 n \n');
  append(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks,{type:'application/pdf'});
}

    ['E. 申请声明 · Declaration',[
      ['sales','销售顾问姓名','Sales consultant','text',1],['salesEmail','销售邮箱（选填，留空发给租赁团队）','Sales email','email'],
      ['agreement','我已阅读销售提供的租赁协议样本及相关附件，并确认本次申请信息。','I have read the sample lease and related attachments provided by the sales team and confirm my application details.','check',1,1],

const form = document.querySelector('#application');
const panels = document.querySelector('#panels');
const nav = document.querySelector('#steps');
const notice = document.querySelector('#notice');
const next = document.querySelector('#next');
const back = document.querySelector('#back');
const controls = new Map();
const signatures = new Map();
let step = 0;
let reached = 0;
let reportUrl = null;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function field([key, label, english, type, required, wide]) {
  const wrap = element('label','',wide ? 'field wide' : 'field');
  const heading = element('span');
  const title = document.createTextNode(label);
  heading.append(title);
  localized.push(() => { title.data = t(label,english); });
  if (required) heading.append(element('b',' *','required'));
  if (type !== 'check') {
    const subtitle = element('small',english);
    heading.append(subtitle);
    localized.push(() => { subtitle.hidden = language === 'en'; });
  }
  wrap.append(heading);
  const control = element(Array.isArray(type) ? 'select' : type === 'textarea' ? 'textarea' : 'input');
  control.name = key;
  control.required = Boolean(required);
  if (Array.isArray(type)) {
    for (const option of ['',...type]) {
      const item = translated('option',()=>optionLabel(option));
      item.value = option;
      control.append(item);
    }
  } else if (type === 'textarea') {
    control.rows = 3;
    control.maxLength = 1000;
  } else {
    control.type = type === 'count' || type === 'money' ? 'number' : type === 'check' ? 'checkbox' : type;
    if (type === 'count' || type === 'money') {
      control.min = ['adults','months'].includes(key) ? '1' : '0';
      control.step = type === 'money' ? '0.01' : '1';
    }
    if (['text','email','tel'].includes(type)) control.maxLength = 200;
  }
  if (['postcode','currentPostcode'].includes(key)) control.inputMode = 'numeric';
  const nameExample = /^(surname|relativeSurname[12])$/.test(key) ? 'Zhang'
    : /^(given|relativeGiven[12])$/.test(key) ? 'San' : '';
  if (nameExample) {
    const hint = translated('small',()=>t(
      `请按证件英文拼写，例如 ${nameExample}。`,
      `Use the spelling on your ID, e.g. ${nameExample}.`
    ),'name-example');
    hint.id = key+'-hint';
    control.setAttribute('aria-describedby',hint.id);
    control.placeholder = nameExample;
    wrap.append(control,hint);
  } else {
    if (key === 'property' || key === 'currentAddress') control.placeholder = '12 George Street, Sydney NSW';
    wrap.append(control);
  }
  controls.set(key, control);
  return wrap;
}

function addTerms(parent, text) {
  parent.append(translated('div',()=>displayTerms(text,true),'terms'));
}

function signature(key) {
  const box = element('div','','signature');
  box.append(translated('h3',()=>signTitle(key)),translated('p',()=>t('请在下方手写签名，再填写签署日期。','Sign by hand below, then enter the signing date.')));
  const pad = element('div','','sig-pad');
  const canvas = element('canvas');
  canvas.width = 1000;
  canvas.height = 300;
  localized.push(()=>canvas.setAttribute('aria-label',signTitle(key)));
  pad.append(canvas);
  const actions = element('div','','sig-tools');
  const status = element('span');
  const updateStatus = () => { status.textContent = hasInk ? t('已签字','Signed') : t('待签字','Awaiting signature'); };
  localized.push(updateStatus);
  status.setAttribute('aria-live','polite');
  const clear = translated('button',()=>t('清除重签','Clear signature'),'secondary');
  clear.type = 'button';
  actions.append(status,clear);
  const date = field([key+'Date','签署日期','Date signed','date',1]);
  box.append(pad,actions,date);
  const pen = canvas.getContext('2d');
  pen.strokeStyle = '#17362b';
  pen.lineCap = 'round';
  pen.lineJoin = 'round';
  pen.lineWidth = 5;
  let active = null;
  let hasInk = false;
  let last;
  const position = event => {
    const r = canvas.getBoundingClientRect();
    return [(event.clientX-r.left)*canvas.width/r.width,(event.clientY-r.top)*canvas.height/r.height];
  };
  canvas.addEventListener('pointerdown', event => {
    if (active !== null || event.button !== 0) return;
    active = event.pointerId;
    canvas.setPointerCapture(active);
    last = position(event);
  });
  canvas.addEventListener('pointermove', event => {
    if (active !== event.pointerId) return;
    const point = position(event);
    if (Math.hypot(point[0]-last[0],point[1]-last[1]) < 2) return;
    pen.beginPath();
    pen.moveTo(...last);
    pen.lineTo(...point);
    pen.stroke();
    last = point;
    hasInk = true;
    updateStatus();
    notice.textContent = '';
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']) {
    canvas.addEventListener(type,event => { if (event.pointerId === active) active = null; });
  }
  clear.addEventListener('click', () => {
    pen.clearRect(0,0,canvas.width,canvas.height);
    hasInk = false;
    updateStatus();
  });
  signatures.set(key,{canvas,box,hasInk:()=>hasInk,clear:()=>clear.click()});
  return box;
}

for (const [index, stage] of stages.entries()) {
  const panel = element('section','','panel');
  const title = translated('h2',()=>t(stage.title,stageTitles[index]));
  title.tabIndex = -1;
  panel.append(element('div',`STEP 0${index+1} / ${stage.en}`,'kicker'),title,translated('p',()=>t(stage.lead,stageLeads[index]),'lead'));
  for (const [heading, fields] of stage.groups) {
    const group = element('section','','group');
    const grid = element('div','','grid');
    group.append(translated('h3',()=>groupLabel(heading)),grid);
    for (const definition of fields) grid.append(field(definition));
    if (heading.startsWith('D.')) {
      const info = element('details');
      info.append(translated('summary',()=>t('查看公用服务开通流程与说明','View utility connection information')));
      addTerms(info,'utilities');
      group.append(info);
    }
    if (heading.startsWith('E.')) {
      addTerms(group,'declaration');
      group.append(signature('declaration'));
    }
    if (heading.startsWith('I.')) {
      addTerms(group,'holding');
      group.append(signature('holding'));
    }
    panel.append(group);
  }
  if (index === 4) {
    panel.append(element('div','','review'));
    const id = element('details','','group');
    id.append(translated('summary',()=>t('J. 查看 100 分身份证明材料清单','J. View the 100-point identification checklist')));
    addTerms(id,'id');
    panel.append(id,element('div','','send'));
  }
  panels.append(panel);
  const jump = element('button');
  jump.type = 'button';
  jump.append(element('span',String(index+1).padStart(2,'0'),'stepnum'),translated('span',()=>t(stage.title,stageTitles[index])));
  jump.addEventListener('click',()=>navigate(index));
  nav.append(jump);
}

const value = key => controls.get(key).value.trim();
function reportValue(key) {
  const control = controls.get(key);
  if (control.type === 'checkbox') return control.checked ? t('是','Yes') : '—';
  const answer = value(key);
  return control.tagName === 'SELECT' && answer ? optionLabel(answer) : answer || '—';
}

function renderReview() {
  const review = document.querySelector('.review');
  review.replaceChildren();
  for (const [index, stage] of stages.slice(0,4).entries()) {
    const row = element('details','','overview group');
    row.open = index === 0;
    row.append(element('summary',t(stage.title,stageTitles[index])));
    for (const [heading,fields] of stage.groups) {
      row.append(element('h4',groupLabel(heading)));
      for (const [key,label,english] of fields) row.append(element('p',t(label,english) + ' · ' + reportValue(key)));
    }
    review.append(row);
  }
  const line = element('p',t(`已签署申请声明（${value('declarationDate')}）及留房费条款（${value('holdingDate')}）。`,`Declaration signed ${value('declarationDate')}. Holding fee terms signed ${value('holdingDate')}.`),'terms');
  review.append(line);
}

function render(focus) {
  for (const [i,panel] of [...panels.children].entries()) {
    panel.hidden = i !== step;
    for (const control of panel.querySelectorAll('input, textarea, select')) control.disabled = i !== step;
  }
  for (const [i,jump] of [...nav.children].entries()) {
    jump.disabled = i > reached;
    if (i === step) jump.setAttribute('aria-current','step');
    else jump.removeAttribute('aria-current');
  }
  document.querySelector('#mobile-progress').textContent = `${t('步骤','Step')} ${step+1} / ${stages.length} · ${t(stages[step].title,stageTitles[step])}`;
  back.hidden = step === 0;
  back.textContent = t('上一步','Back');
  next.textContent = step === 4 ? t('导出签字版 PDF','Export signed PDF') : t('继续 →','Continue →');
  notice.textContent = '';
  notice.className = '';
  if (step === 4) {
    renderReview();
    const send = document.querySelector('.send');
    send.replaceChildren();
    send.className = 'send';
    if (reportUrl) URL.revokeObjectURL(reportUrl);
    reportUrl = null;
  }
  if (focus) {
    panels.children[step].querySelector('h2').focus({preventScroll:true});
    document.querySelector('main').scrollIntoView({block:'start'});
  }
}

function checkStage(index) {
  for (const control of panels.children[index].querySelectorAll('input, textarea, select')) {
    control.setCustomValidity('');
    if (!control.checkValidity()) {
      control.reportValidity();
      return false;
    }
    if (control.required && control.type === 'text' && !control.value.trim()) {
      control.setCustomValidity(t('请填写此项。','Please fill out this field.'));
      control.reportValidity();
      return false;
    }
    const answer = control.value.trim();
    if (answer && ['text','textarea'].includes(control.type) &&
        !/^[\p{Script=Latin}\p{M}0-9\p{P}+$&\s]+$/u.test(answer)) {
      control.setCustomValidity(t('请用英文字母填写，例如 Zhang San。可以使用数字和标点。','Use Latin letters, such as Zhang San. Numbers and punctuation are allowed.'));
      control.reportValidity();
      return false;
    }
  }
  if (index === 3) {
    if (Number(value('holding')) > Number(value('rent'))) {
      notice.textContent = t('留房费不能超过一周租金，请与销售顾问核对金额。','The holding fee cannot exceed one week’s rent. Check the amount with your sales consultant.');
      controls.get('holding').focus();
      return false;
    }
    for (const sig of signatures.values()) {
      if (!sig.hasInk()) {
        notice.textContent = t('请先完成两处手写签名。','Please complete both handwritten signatures.');
        sig.box.scrollIntoView({block:'center'});
        return false;
      }
    }
  }
  return true;
}

function navigate(target) {
  while (step < target) {
    if (!checkStage(step)) return;
    step += 1;
    reached = Math.max(reached,step);
    render(false);
  }
  step = target;
  render(true);
}
form.noValidate = true;
form.addEventListener('input', event => {
  event.target.setCustomValidity?.('');
  notice.textContent = '';
  if (!['declarationDate','holdingDate','salesEmail'].includes(event.target.name)) {
    for (const [key,sig] of signatures) {
      if (key === 'declaration' && event.target.name === 'holding') continue;
      if (sig.hasInk()) {
        sig.clear();
        notice.textContent = t('申请内容已修改，请重新签字。','Application details changed. Please sign again.');
      }
    }
  }
});
back.addEventListener('click',()=>navigate(step-1));
form.addEventListener('submit',event=>{
  event.preventDefault();
  if (step < 4) return navigate(step+1);
  try {
    const pdf = buildReport();
    const filename = `Inndeavor-Tenancy-Application-${t('CN','EN')}.pdf`;
    if (reportUrl) URL.revokeObjectURL(reportUrl);
    reportUrl = URL.createObjectURL(pdf);
    const download = element('a',t('下载 PDF','Download PDF'));
    download.href = reportUrl;
    download.download = filename;
    const preview = element('a',t('打开 PDF','Open PDF'));
    preview.href = reportUrl;
    preview.target = '_blank';
    preview.rel = 'noopener';
    const email = element('a',t('打开邮件草稿','Open email draft'));
    const recipient = value('salesEmail') || 'rentalteam@inndeavor.com';
    const subject = t('Inndeavor 租房申请','Inndeavor Tenancy Application');
    const body = t('您好，随信附上我的签字版租房申请。谢谢！','Hi, please find my signed tenancy application attached. Thank you.');
    email.href = 'mailto:'+encodeURIComponent(recipient)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    const actions = element('div','','export-actions');
    const file = new File([pdf],filename,{type:'application/pdf'});
    if (navigator.share && navigator.canShare?.({files:[file]})) {
      const share = element('button',t('分享 PDF','Share PDF'));
      share.type = 'button';
      share.addEventListener('click',async()=>{
        try {
          await navigator.share({files:[file]});
        } catch (error) {
          if (error.name !== 'AbortError') notice.textContent = t('分享失败，请试用下载或打开 PDF。','Sharing failed. Download or open the PDF instead.');
        }
      });
      actions.append(share);
    }
    actions.append(download,preview,email);
    const sent = document.querySelector('.send');
    sent.className = 'send send-box';
    const hint = t(`可直接分享文件，或下载后附到邮件发至 ${recipient}。若手机无法下载，可先打开 PDF，再用浏览器菜单保存或分享。`,`Share the file, or download and attach it to an email to ${recipient}. If your phone cannot download it, open the PDF and use your browser’s save or share menu.`);
    sent.replaceChildren(element('strong',t('PDF 已生成','PDF ready')),element('p',hint),actions);
    sent.scrollIntoView({block:'nearest'});
  } catch (error) {
    console.error(error);
    notice.textContent = t('PDF 未能生成。请保留当前页面并重试。','The PDF could not be generated. Keep this page open and try again.');
  }
});
function setLanguage(nextLanguage) {
  language = nextLanguage;
  document.documentElement.lang = t('zh-CN','en');
  document.title = t('Inndeavor · 租房申请','Inndeavor · Tenancy Application');
  document.querySelector('.intro h1').textContent = t('租房申请','Tenancy application');
  document.querySelector('.intro p').textContent = t('填写申请信息并完成两处签字，然后将 PDF 发给销售顾问。','Fill in the application, sign in both places, then send the PDF to your sales consultant.');
  document.querySelector('.writing-guide').textContent = writingGuide();
  document.querySelector('aside').setAttribute('aria-label',t('填写进度','Application progress'));
  document.querySelector('.steps-label').textContent = t('申请进度','Application progress');
  document.querySelector('.privacy strong').textContent = t('资料保存在当前页面','Your information stays on this page');
  document.querySelector('.privacy p').textContent = t('关闭或刷新页面前，请先保存 PDF。','Save the PDF before closing or reloading this page.');
  for (const button of document.querySelectorAll('[data-language]')) {
    button.setAttribute('aria-pressed',String(button.dataset.language === language));
  }
  for (const update of localized) update();
  for (const control of controls.values()) control.setCustomValidity('');
  render(false);
}

for (const button of document.querySelectorAll('[data-language]')) {
  button.addEventListener('click',()=> {
    if (language !== button.dataset.language) setLanguage(button.dataset.language);
  });
}
setLanguage(navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en');
</script>
</body>
</html>
